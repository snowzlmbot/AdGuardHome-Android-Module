name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-fixture-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install BusyBox
        run: sudo apt-get update && sudo apt-get install -y busybox-static
      - name: Run DNS filter regressions
        run: |
          python3 tests/dns_filter_regression.py
          python3 tests/boot_regression_test.py
      - name: Run fixture tests
        shell: sh
        run: |
          chmod +x tests/*.sh tests/static/check-shell.sh tests/fixtures/iptables-recording-bin/* tests/fixtures/android-network-bin/*
          sh tests/platform_test.sh
          sh tests/credentials_test.sh
          sh tests/migration_test.sh
          sh tests/core_worker_test.sh
          sudo -E sh tests/core_native_test.sh
          sh tests/supervisor_test.sh
          sh tests/control_test.sh
          sh tests/backup_test.sh
          sh tests/network_test.sh
          sh tests/firewall_test.sh
          sh tests/proxy_adapter_test.sh
          sh tests/file_adapter_test.sh
          sh tests/file_rules_test.sh
          sh tests/diagnostics_test.sh
          sh tests/uninstall_test.sh
          sh tests/install_options_test.sh
          sh tests/i18n_test.sh
          sh tests/webui_test.sh
      - name: Run packaging test
        shell: sh
        run: sh tests/package_test.sh
      - name: Run repair regression
        run: python3 tests/repair_regression.py
      - name: Run BusyBox ash checks
        shell: sh
        run: BUSYBOX_BIN=busybox tests/static/check-shell.sh .
      - name: Verify diff hygiene
        run: git diff --check

  package-candidate:
    if: github.event_name == 'workflow_dispatch'
    needs: shell-and-fixture-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and package candidate
        run: |
          build/build-fixed-binaries.sh 0.107.79 "$RUNNER_TEMP/binaries"
          version=$(sed -n 's/^version=//p' module/module.prop)
          AGH_BINARY_ROOT="$RUNNER_TEMP/binaries" build/package.sh "$version" 0.107.79 dist
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
          (cd dist && sha256sum *.zip > SHA256SUMS)
      - name: Exercise the patched native binary
        run: |
          chmod +x tests/fixtures/probe-success.sh
          sudo -E env CORE_NATIVE_BINARY="$RUNNER_TEMP/binaries/amd64/AdGuardHome" sh tests/core_native_test.sh
          unzip -t dist/*.zip
          python3 tests/validate_module_zip.py dist/*.zip
          python3 tests/installer_contract_test.py dist/*.zip
      - name: Run BusyBox startup without curl
        run: |
          mkdir -p "$RUNNER_TEMP/android-bin"
          busybox --install -s "$RUNNER_TEMP/android-bin"
          ln -sf "$(command -v python3)" "$RUNNER_TEMP/android-bin/python3"
          ln -sf "$(command -v curl)" "$RUNNER_TEMP/android-bin/curl"
          ln -sf "$(command -v sh)" "$RUNNER_TEMP/android-bin/sh"
          sudo -E env CORE_NATIVE_BINARY="$RUNNER_TEMP/binaries/amd64/AdGuardHome" PATH="$RUNNER_TEMP/android-bin" /usr/bin/busybox sh tests/core_native_test.sh
          rm "$RUNNER_TEMP/android-bin/curl"
          sudo -E env CORE_NATIVE_BINARY="$RUNNER_TEMP/binaries/amd64/AdGuardHome" PATH="$RUNNER_TEMP/android-bin" /usr/bin/busybox sh tests/core_native_test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: module-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
