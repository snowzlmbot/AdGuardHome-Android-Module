# 1=LAN-compatible, 2=encrypted-upstream, 3=bootstrap domain upstream
mode=2
I_network=0
Lock_sleep=0
port_testing=1
redirect_ipv4_dns=true
redirect_ipv6_dns=true
# Strict Private DNS cannot fall back when blocked. Encrypted DNS blocking is
# opt-in; DoH on HTTPS/443 is not covered by these port rules.
block_ipv4_dot=false
block_ipv6_dot=false
block_ipv4_doq=false
block_ipv6_doq=false
# Per-app HTTPDNS endpoint blocking (IPv4 only). Targets are listed in
# httpdns-targets.conf; see the file header for source and risk notes.
block_app_httpdns=false
bypass_vpn_dns=true
bypass_vpn_encrypted_dns=true
bypass_vpn_traffic=true
lan_dns_target=
bootstrap_dns=
