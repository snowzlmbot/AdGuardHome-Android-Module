# Per-app HTTPDNS bypass endpoint list (package|ip|port), one target per line.
# Lines starting with # and blank lines are ignored; any other invalid line is
# skipped and logged, it never fails the whole firewall.
#
# Source: measured on a real Xiaomi 14 Ultra (HyperOS) where Coolapk
# (com.coolapk.market) bypasses ordinary DNS filtering by resolving its ad
# endpoints through these Tencent Cloud HTTPDNS IPs over TLS/443.
# Blocking here forces the app back onto plain DNS, which the module filters.
#
# Risk note: HTTPDNS endpoints are static and can change with app updates or
# CDN rotation. A changed IP silently stops matching; keep this list current.
# This only rejects the listed TCP destinations from the listed app UID; it
# does not intercept other traffic.
#
# Format: package|ipv4|port. IPv4 only in this version; IPv6 target lines are
# skipped. Port range 1-65535. Loopback/unspecified/multicast/broadcast
# addresses are skipped. At most 64 targets are applied; the rest are skipped.
# This file is copied to /data/adb/agh/config/httpdns-targets.conf on install
# (only when absent) and can be edited there.
com.coolapk.market|119.29.29.87|443
com.coolapk.market|119.29.29.89|443
com.coolapk.market|119.29.29.91|443
com.coolapk.market|119.28.28.87|443
